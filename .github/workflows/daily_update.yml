name: Daily Wordle Update

on:
  schedule:
    # 每天 UTC 時間 08:00 (約台灣時間 16:00) 執行
    # NYT 通常在當地時間午夜更新，稍微晚一點跑比較保險
    - cron: '0 8 * * *'
  workflow_dispatch: # 允許手動點擊按鈕觸發 (方便測試)

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run update script
        run: python scripts/update_wordle.py

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "🤖 Auto-update: Add today's Wordle answer"
          file_pattern: 'data/*.csv'
          branch: main # 或是 master，請確認你的預設分支名稱
